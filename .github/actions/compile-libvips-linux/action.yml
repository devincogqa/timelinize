name: 'Set up libvips'
description: 'Build and cache libvips from source (useful because Ubuntu package is often too old)'
inputs:
  libvips-version:
    description: 'Version of libvips to build (pin this to avoid flaky GitHub API lookups and unexpected cache invalidation)'
    required: false
    default: '8.18.2'
runs:
  using: 'composite'
  steps:
    - name: Cache libvips
      id: cache-libvips
      uses: actions/cache@v4
      with:
        path: /opt/libvips
        key: libvips-${{ inputs.libvips-version }}-${{ runner.os }}-${{ runner.arch }}

    # The next few steps are derived from instructions at:
    # https://github.com/libvips/libvips/wiki/Build-for-Ubuntu#building-from-source

    # Runtime/dev libraries are always needed: pkg-config and -dev packages
    # provide .pc files and headers required by CGO during the Go build step.
    - name: Install library dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libglib2.0-dev \
          libcfitsio-dev \
          libexif-dev \
          libexpat1-dev \
          libfftw3-dev \
          libgsf-1-dev \
          libheif-dev \
          libimagequant-dev \
          libjpeg-turbo8-dev \
          liblcms2-dev \
          libmatio-dev \
          libopenexr-dev \
          libopenjp2-7-dev \
          libopenslide-dev \
          liborc-dev \
          libpango1.0-dev \
          libpoppler-glib-dev \
          librsvg2-dev \
          libtiff5-dev \
          libwebp-dev

    # Build tools are only needed when compiling from source (cache miss)
    - name: Install build tools
      if: steps.cache-libvips.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          bc \
          meson \
          ninja-build

    # the official instructions refer to a PPA that was archived just a few days
    # ago at time of writing this comment, so build cgif from source instead
    # (this isn't strictly required, only if rendering animated gifs at runtime)
    - name: Build and install cgif (optional libvips dependency)
      if: steps.cache-libvips.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone https://github.com/dloebl/cgif.git
        cd cgif
        meson setup build --prefix=/opt/libvips --buildtype=release
        cd build
        meson compile
        sudo meson install

    - name: Build and install libvips
      if: steps.cache-libvips.outputs.cache-hit != 'true'
      shell: bash
      run: |
        VERSION=${{ inputs.libvips-version }}
        wget https://github.com/libvips/libvips/archive/refs/tags/v${VERSION}.tar.gz
        tar xf v${VERSION}.tar.gz
        cd libvips-${VERSION}
        meson setup build --prefix=/opt/libvips --libdir=lib --buildtype=release -Dintrospection=disabled
        cd build
        meson compile
        sudo meson install

    - name: Configure libvips
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=/opt/libvips/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/opt/libvips/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "CGO_CFLAGS=-I/opt/libvips/include" >> $GITHUB_ENV
        echo "CGO_LDFLAGS=-L/opt/libvips/lib -Wl,-rpath,/opt/libvips/lib" >> $GITHUB_ENV
        echo "/opt/libvips/bin" >> $GITHUB_PATH
        sudo ldconfig /opt/libvips/lib
